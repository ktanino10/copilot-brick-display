name: Publish verified static workshop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the already-generated public package
        run: node tests/motion.mjs && node tests/static.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared browser-validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Verify real browser behavior before deployment
        run: python tests/run_web.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: |
            validation/web.json
            build/screenshots/
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
