name: Publish verified static workshop
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy after validation (leave false for a review-branch browser preview)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select explicit publication mode
        id: mode
        run: node scripts/publication_mode.mjs
      - name: Verify privacy maintenance distribution
        if: steps.mode.outputs.maintenance == 'true'
        run: node tests/maintenance.mjs
      - name: Verify the already-generated public package
        if: steps.mode.outputs.maintenance != 'true'
        run: node tests/motion.mjs && node tests/static.mjs
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.maintenance != 'true'
        with:
          python-version: "3.11"
      - name: Install declared browser-validation dependencies
        if: steps.mode.outputs.maintenance != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Check public and private personalization boundaries
        if: steps.mode.outputs.maintenance != 'true'
        run: python -m unittest discover -s tests -p test_personalization.py -v
      - name: Verify staged trial selection without changing geometry
        if: steps.mode.outputs.maintenance != 'true'
        run: |
          python -m unittest discover -s tests -p test_trial_subset.py -v
          python scripts/verify_trial_subset.py
      - name: Verify cross-PC color printing instructions
        if: steps.mode.outputs.maintenance != 'true'
        run: python -m unittest discover -s tests -p test_cross_pc_guide.py -v
      - name: Verify every print occurrence and assembly pose
        if: steps.mode.outputs.maintenance != 'true'
        run: |
          python -m unittest discover -s tests -p test_assembly_guide.py -v
          node tests/assembly_guide_model.mjs
      - name: Verify revised lettering and actual small glyph trials
        if: steps.mode.outputs.maintenance != 'true'
        run: python -m unittest discover -s tests -p test_lettering_revision.py -v
      - name: Verify real browser behavior before deployment
        if: steps.mode.outputs.maintenance != 'true'
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          google-chrome --version
          python tests/run_web.py
      - name: Bind current browser evidence to the public release
        if: steps.mode.outputs.maintenance != 'true'
        run: |
          python scripts/finalize_evidence.py --require-browser
          python scripts/verify_revision_invariants.py
          node tests/static.mjs
      - name: Preserve browser evidence
        if: always() && steps.mode.outputs.maintenance != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: |
            validation/web.json
            site/downloads/validation.json
            build/screenshots/
            build/assembly-guide-ci-http/
            build/assembly-guide-ci-file/
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || inputs.publish
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || inputs.publish
        with:
          path: site
  deploy:
    if: github.event_name == 'push' || inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
